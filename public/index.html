<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#495E57" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/og-little-lemon.svg" />
    <title>Little Lemon Chicago | Mediterranean Restaurant &amp; Table Reservations</title>
    <meta
      name="description"
      content="Little Lemon is a family-owned Mediterranean restaurant in Chicago focused on traditional recipes served with a modern twist. Reserve a table online in seconds."
    />
    <!-- Open Graph Protocol (OGP) Meta Tags -->
    <meta property="og:title" content="Little Lemon Chicago — Reserve a Table Online" />
    <meta
      property="og:description"
      content="Experience authentic Mediterranean cuisine in Chicago. Browse our weekly specials and reserve your table online at Little Lemon."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/og-little-lemon.svg" />
    <meta property="og:site_name" content="Little Lemon Restaurant" />

    <!-- Brand Typography: Markazi Text (Display) & Karla (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&family=Markazi+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Meta Capstone Booking API Library (with resilient local fallback in src/utils/bookingAPI.js) -->
    <script
      src="https://raw.githubusercontent.com/courseraap/capstone/main/api.js"
      defer
    ></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run the Little Lemon reservation app.</noscript>
    <div id="root"></div>
  </body>
</html>
